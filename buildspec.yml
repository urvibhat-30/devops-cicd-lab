version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install flask pytest flake8
  pre_build:
    commands:
      - echo "Step 1 - Lint"
      -          - flake8 app.py test_app.py --extend-ignore=W291,W292,W293,W391,E302,E303,E305 --max-line-length=120
      - echo "Step 2 - Unit tests"
      - pytest -v
      - echo "Logging in to ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${ECR_URI%%/*}
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "Image tag will be $IMAGE_TAG"
  build:
    commands:
      - echo "Step 3 - Docker build"
      - docker build -t $ECR_URI:$IMAGE_TAG .
      - docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest
      - echo "Step 4 - Push to ECR"
      - docker push $ECR_URI:$IMAGE_TAG
      - docker push $ECR_URI:latest
      - printf '[{"name":"app","imageUri":"%s"}]' $ECR_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
